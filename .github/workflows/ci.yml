name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        # The llm extra is optional. Test the install the README recommends as
        # well as the full one, or a test that needs the SDK hides its own
        # dependency behind CI always having it.
        extras: ["dev", "dev,llm"]
    name: py${{ matrix.python-version }} [${{ matrix.extras }}]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -e ".[${{ matrix.extras }}]"

      - run: ruff check .

      - run: pytest -q

      # The front end has no build step, so this is the only check that it parses.
      - run: node --check randostats/static/app.js

  packaged:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: non-editable install
    # An editable install reads the data files out of the checkout, so it
    # cannot tell whether the packs and voices are in the built package.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip

      - run: pip install .

      # Run it from somewhere the checkout is not importable.
      - run: cd "$RUNNER_TEMP" && randostats counter "70% of people"
