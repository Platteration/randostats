name: release-build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        run: python -m pip install --upgrade build
      - name: Build distributions
        run: python -m build
      - name: Smoke-test wheel
        run: |
          python -m venv /tmp/randostats-release-check
          /tmp/randostats-release-check/bin/pip install dist/*.whl
          /tmp/randostats-release-check/bin/randostats --help
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: randostats-dist-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
