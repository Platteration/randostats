[project]
name = "randostats"
version = "0.1.0"
description = "Statistics on your sent and received messages, plus a live counterpoint engine that answers a statistic with an equally true, equally irrelevant one."
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "pyspellchecker>=0.8",
    "pydantic>=2",
]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
dev = ["pytest>=8", "httpx>=0.27", "ruff"]

[project.scripts]
randostats = "randostats.cli:main"

[build-system]
# The PEP 639 license fields above (an expression plus license-files) need 77.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["randostats*"]

[tool.setuptools.package-data]
randostats = ["static/*", "counterpoint/*.json",
              "counterpoint/packs/*.json", "counterpoint/voices/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Pyflakes plus the pycodestyle errors: the set ruff documented as its default for
# years, spelled out because the ruff pip resolves today enables far more when no
# selection is given. Pinned, `ruff check .` means the same thing in CI as here.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# The file's second half carries its own imports, mid-file after the first tests.
"tests/test_parsers.py" = ["E402"]
