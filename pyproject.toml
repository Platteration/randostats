[project]
name = "randostats"
version = "0.1.0"
description = "Statistics on your sent and received messages, plus a live counterpoint engine that answers a statistic with an equally true, equally irrelevant one."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "pyspellchecker>=0.8",
    "pydantic>=2",
]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
randostats = "randostats.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["randostats*"]

[tool.setuptools.package-data]
randostats = ["static/*", "counterpoint/*.json",
              "counterpoint/packs/*.json", "counterpoint/voices/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
